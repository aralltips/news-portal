services:
  - type: web
    name: janogoner-konthosor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: "admin123"
      - key: AGENT_TOKEN
        value: "jknews-token-2026"
      - key: GEMINI_API_KEY
        sync: false
      - key: SITE_URL
        value: "https://janogoner-konthosor-qv2e.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: jknews-db
          property: connectionString
      - key: BLOGGER_CLIENT_ID
        sync: false
      - key: BLOGGER_CLIENT_SECRET
        sync: false
      - key: BLOGGER_REFRESH_TOKEN
        sync: false
      - key: BLOGGER_BLOG_ID
        sync: false

databases:
  - name: jknews-db
    plan: free
    databaseName: jknews
    user: jknews_user